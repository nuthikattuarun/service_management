{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Service Management</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">
        <div style="display:flex; justify-content:center; margin-bottom:16px;">
            <div class="brand-logo" style="width:48px; height:48px; font-size:24px;">SM</div>
        </div>
        <h2>Create Account</h2>
        <p class="subtitle">Join Service Management to submit and track requests</p>

        {% if messages %}
            <div class="alerts-container">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags|default:'danger' }}">
                        <span>{{ message }}</span>
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="post" action="{% url 'ui_register' %}">
            {% csrf_token %}
            
            <div class="form-row">
                <div class="form-group">
                    <label for="first_name">First Name</label>
                    <input type="text" id="first_name" name="first_name" class="form-control" required autofocus>
                </div>
                <div class="form-group">
                    <label for="last_name">Last Name</label>
                    <input type="text" id="last_name" name="last_name" class="form-control" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number (Optional)</label>
                <input type="tel" id="phone" name="phone" class="form-control">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary btn-submit">Create My Account</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="{% url 'ui_login' %}">Sign in here</a>
        </div>
    </div>
</div>

</body>
</html>
