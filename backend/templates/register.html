{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Account — ServiceDesk Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="auth-brand-logo">SM</div>
            <h2>Create Enterprise Account</h2>
            <p>Get started with ServiceDesk Pro to log and track tickets</p>
        </div>

        {% if messages %}
            <div class="alerts-container">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags|default:'danger' }}">
                        <span>{{ message }}</span>
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="post" action="{% url 'ui_register' %}">
            {% csrf_token %}
            
            <div class="form-row">
                <div class="form-group">
                    <label for="first_name">First Name <span class="required-star">*</span></label>
                    <input type="text" id="first_name" name="first_name" class="form-control" placeholder="Jane" required autofocus>
                </div>
                <div class="form-group">
                    <label for="last_name">Last Name <span class="required-star">*</span></label>
                    <input type="text" id="last_name" name="last_name" class="form-control" placeholder="Doe" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Work Email <span class="required-star">*</span></label>
                <input type="email" id="email" name="email" class="form-control" placeholder="jane.doe@enterprise.com" required>
            </div>

            <div class="form-group">
                <label for="phone">Contact Phone</label>
                <input type="tel" id="phone" name="phone" class="form-control" placeholder="+1 (555) 000-1234">
            </div>

            <div class="form-group">
                <label for="password">Create Password <span class="required-star">*</span></label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary btn-submit" style="width:100%; margin-top:10px; padding:12px;">Complete Registration</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="{% url 'ui_login' %}">Sign in here</a>
        </div>
    </div>
</div>

</body>
</html>
