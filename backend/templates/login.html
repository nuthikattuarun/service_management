{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Service Management</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">
        <div style="display:flex; justify-content:center; margin-bottom:16px;">
            <div class="brand-logo" style="width:48px; height:48px; font-size:24px;">SM</div>
        </div>
        <h2>Sign In</h2>
        <p class="subtitle">Access your Service Management Dashboard</p>

        {% if messages %}
            <div class="alerts-container">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags|default:'danger' }}">
                        <span>{{ message }}</span>
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="post" action="{% url 'ui_login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="user@example.com" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary btn-submit">Sign In to Dashboard</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="{% url 'ui_register' %}">Register here</a>
        </div>
    </div>
</div>

</body>
</html>
