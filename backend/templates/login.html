{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — ServiceDesk Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="auth-body">

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="auth-brand-logo">SM</div>
            <h2>ServiceDesk Pro</h2>
            <p>Enterprise Service Management Portal</p>
        </div>

        {% if messages %}
            <div class="alerts-container">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags|default:'danger' }}">
                        <div style="display:flex; align-items:center; gap:8px;">
                            <span>⚠️</span>
                            <span>{{ message }}</span>
                        </div>
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="email">Email Address <span class="required-star">*</span></label>
                <input type="email" id="email" name="email" class="form-control" placeholder="name@company.com" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password <span class="required-star">*</span></label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary btn-submit" style="width:100%; margin-top:16px; padding:12px; font-size:14px; font-weight:700;">
                Sign In to Account
            </button>
        </form>

        <div class="auth-footer">
            Don't have an enterprise account? <a href="{% url 'ui_register' %}">Register here</a>
        </div>
    </div>
</div>

</body>
</html>
